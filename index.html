    <!-- Preload aset Title Screen, dipasang lewat skrip HANYA di route "/".
         Sebelumnya berupa <link> statis, yang berarti SETIAP rute mengunduh
         menu-bg.webp (746 KB) - terukur: /contact tidak memuat apa pun selain
         gambar itu, dan tidak pernah memakainya. Alamat yang dibagikan (mis.
         /experience) justru pintu masuk yang paling sering.

         Untuk "/": siluet kota adalah cat pertama layar itu; tanpa preload ia baru
         ditemukan setelah bundel JS diurai dan React merender - satu perjalanan
         bolak-balik penuh setelah HTML tiba. Potretnya satu-satunya foto sungguhan
         di layar pertama, jadi yang paling kelihatan kalau datang terlambat;
         media= dipasang karena di bawah 768px potretnya memang tidak dirender
         sama sekali, dan HP tidak perlu mengunduh aset yang tak akan dipakainya. -->
    <script>
      (function () {
        if (location.pathname !== "/") return;
        [
          ["/menu-bg.webp", null],
          ["/me.webp", "(min-width: 768px)"],
        ].forEach(function (item) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = item[0];
          link.setAttribute("fetchpriority", "high");
          if (item[1]) link.media = item[1];
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body>

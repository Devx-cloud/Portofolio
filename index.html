<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Siluet kota Title Screen: cat pertama di route "/", yaitu pintu masuk
         situs ini. Tanpa preload ia baru ditemukan setelah bundel JS diurai dan
         React merender - satu perjalanan bolak-balik penuh setelah HTML tiba. -->
    <link rel="preload" as="image" href="/menu-bg.webp" fetchpriority="high" />

    <!-- Potret Title Screen: satu-satunya foto sungguhan di layar pertama, jadi
         ia yang paling kelihatan kalau datang terlambat. media= dipasang karena
         di bawah 768px potretnya memang tidak dirender sama sekali - tanpa itu
         HP mengunduh aset yang tidak akan pernah dipakainya. -->
    <link rel="preload" as="image" href="/me.webp" media="(min-width: 768px)" />
    <title>Vite + React</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Tempat foto diri">
  <!--
    Pengganti sementara untuk foto diri. Sengaja dibuat sebagai pelat framing
    fotografer, bukan siluet orang: siluet terbaca sebagai "gambar yang gagal
    dimuat", sementara pelat framing terbaca sebagai "tempat yang disediakan".

    Warnanya abu-abu netral beropasitas rendah dan latarnya TRANSPARAN, jadi ia
    terbaca di tema terang maupun gelap tanpa perlu dua berkas.

    PENTING - zona aman: bingkainya di About.jsx memakai object-cover pada
    gambar setinggi 114% lalu menggesernya +-6% untuk parallax. Yang DIJAMIN
    selalu terlihat cuma pita y=80..800 dari viewBox ini; di luar itu terpotong
    di sebagian posisi gulungan. Semua isi di bawah ditaruh di dalam pita itu.
    (Versi pertama menaruh labelnya di y=905 dan label itu tidak pernah muncul.)

    Ganti dengan foto asli: taruh berkasnya di public/ lalu ubah PORTRAIT di
    src/data/profile.js. Rasio tata letaknya 4:5 (potret).
  -->

  <!-- Label + penanda merah, sejajar di kepala pelat -->
  <g transform="translate(0 148)">
    <rect x="248" y="-11" width="14" height="14" fill="#E5384C" />
    <text x="286" y="2" fill="#8A8A8A" opacity="0.75"
          font-family="ui-monospace, 'JetBrains Mono', monospace"
          font-size="25" letter-spacing="7">FOTO DIRI</text>
  </g>

  <g fill="none" stroke="#8A8A8A" stroke-width="2" opacity="0.45">
    <!-- Tanda sudut framing -->
    <path d="M64 300 V220 H144" />
    <path d="M656 220 H736 V300" />
    <path d="M736 700 V780 H656" />
    <path d="M144 780 H64 V700" />

    <!-- Salib bidik di titik pusat pita aman -->
    <path d="M400 470 v60 M370 500 h60" opacity="0.7" />
  </g>

  <!-- Kerangka kepala dan bahu: cukup untuk menyatakan orientasi potret
       (di mana wajah akan berada), tanpa berpura-pura jadi orang. -->
  <g fill="none" stroke="#8A8A8A" stroke-width="2" opacity="0.3">
    <circle cx="400" cy="400" r="104" />
    <path d="M218 790 a182 182 0 0 1 364 0" />
  </g>
</svg>
